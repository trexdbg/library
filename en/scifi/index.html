<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#0b0a08">
<meta name="description" content="Possible futures, space, technology and ideas. Here the library looks outward and asks what humanity could become.">
<title>Science fiction — Libria</title>
<link rel="stylesheet" href="../../wing.css">
</head>
<body data-genre="scifi" data-lang="en">
<header class="wing-header">
  <a class="wing-brand" href="../../"><span class="wing-brand__seal">L</span><strong>LIBRIA</strong></a>
  <div class="wing-actions">
    <a class="wing-home" href="../../">Back to map</a>
    <a class="wing-lang" id="languageSwitch" href="#"></a>
  </div>
</header>
<main>
<section class="wing-hero">
  <div class="wing-hero__content">
    <p class="wing-eyebrow">Wing · Science fiction</p>
    <h1>The observatory</h1>
    <p class="wing-hero__intro">Possible futures, space, technology and ideas. Here the library looks outward and asks what humanity could become.</p>
    <div class="wing-meta"><strong id="bookCount"></strong><span>LIBRIA / Science fiction</span></div>
  </div>
</section>

<nav class="wing-nav" aria-label="Library wings">
  <a data-genre-link="fantasy"></a>
  <a data-genre-link="scifi"></a>
  <a data-genre-link="polar"></a>
  <a data-genre-link="jeunesse"></a>
  <a data-genre-link="classics"></a>
  <a data-genre-link="romance"></a>
  <a data-genre-link="horror"></a>
</nav>

<section class="wing-content">
  <div class="wing-toolbar">
    <div><h2>Current selection</h2><p>Browse the books currently available in this wing.</p></div>
    <label class="wing-search"><span aria-hidden="true">⌕</span><input id="wingSearch" type="search" autocomplete="off"></label>
  </div>
  <div class="book-grid" id="bookGrid"></div>
</section>
</main>

<dialog id="bookDialog" aria-labelledby="dialogTitle">
  <form method="dialog" class="dialog-close"><button type="submit" aria-label="Close">×</button></form>
  <div class="book-dialog__layout">
    <div class="book-dialog__visual"><div class="book-dialog__cover" id="dialogCover"></div></div>
    <div class="book-dialog__body">
      <p class="wing-eyebrow">Libria selection</p>
      <h2 id="dialogTitle"></h2>
      <p class="book-dialog__subtitle" id="dialogSubtitle"></p>
      <p class="book-dialog__author" id="dialogAuthor"></p>
      <div class="book-tags" id="dialogTags"></div>
      <p class="book-summary" id="dialogSummary"></p>
      <div class="book-review"><small id="dialogReviewLabel"></small><p id="dialogReview"></p></div>
    </div>
  </div>
</dialog>
<script type="module" src="../../wing.js"></script>
</body></html>
