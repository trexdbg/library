<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0908">
  <meta name="description" content="Libria, une bibliothèque virtuelle immersive où l’on se promène de salle en salle pour découvrir des livres.">
  <title>Libria — La bibliothèque vivante</title>
  <link rel="stylesheet" href="../styles.css">
</head>
<body>
  <div class="app" id="app">
    <header class="site-header">
      <button class="brand" id="homeButton" type="button" aria-label="Retour au hall">
        <span class="brand__seal" aria-hidden="true">L</span>
        <span class="brand__copy">
          <strong>LIBRIA</strong>
          <small id="brandTagline">La bibliothèque vivante</small>
        </span>
      </button>
      <div class="location" aria-live="polite">
        <span class="location__line" aria-hidden="true"></span>
        <span id="locationLabel">Hall</span>
      </div>
      <div class="header-actions">
        <button class="header-button" id="searchButton" type="button" aria-haspopup="dialog">
          <span aria-hidden="true">⌕</span>
          <span id="searchButtonLabel">Rechercher</span>
        </button>
        <a class="language-button" id="languageButton" href="../en/" hreflang="en">EN</a>
      </div>
    </header>

    <main class="viewport" id="viewport" tabindex="0" aria-label="Bibliothèque virtuelle">
      <div class="world" id="world"></div>
      <div class="edge-shade edge-shade--left" aria-hidden="true"></div>
      <div class="edge-shade edge-shade--right" aria-hidden="true"></div>
      <div class="walk-hint" id="walkHint" aria-hidden="true">
        <span>←</span><span id="walkHintText">Molette, glisser ou balayer pour se promener</span><span>→</span>
      </div>
    </main>

    <nav class="compass" id="compass" aria-label="Navigation dans la bibliothèque">
      <button class="compass__arrow" id="previousRoom" type="button" aria-label="Salle précédente">←</button>
      <div class="compass__rooms" id="compassRooms"></div>
      <button class="compass__arrow" id="nextRoom" type="button" aria-label="Salle suivante">→</button>
    </nav>

    <dialog class="search-dialog" id="searchDialog" aria-labelledby="searchTitle">
      <form method="dialog" class="dialog-close-form">
        <button class="dialog-close" type="submit" aria-label="Close">×</button>
      </form>
      <p class="dialog-eyebrow" id="searchEyebrow">Catalogue Libria</p>
      <h2 id="searchTitle">Trouver un livre</h2>
      <label class="search-field">
        <span aria-hidden="true">⌕</span>
        <input id="searchInput" type="search" autocomplete="off" placeholder="Titre, auteur, univers…">
      </label>
      <div class="search-results" id="searchResults"></div>
    </dialog>

    <dialog class="book-dialog" id="bookDialog" aria-labelledby="bookTitle">
      <form method="dialog" class="dialog-close-form">
        <button class="dialog-close" type="submit" aria-label="Close">×</button>
      </form>
      <div class="book-dialog__layout">
        <div class="book-dialog__cover-wrap">
          <div class="book-dialog__cover" id="bookCover"></div>
        </div>
        <div class="book-dialog__content">
          <p class="dialog-eyebrow" id="bookKicker">Sélection Libria</p>
          <h2 id="bookTitle"></h2>
          <p class="book-dialog__subtitle" id="bookSubtitle"></p>
          <p class="book-dialog__author" id="bookAuthor"></p>
          <div class="book-tags" id="bookTags"></div>
          <p class="book-dialog__summary" id="bookSummary"></p>
          <blockquote class="book-review">
            <span id="reviewLabel">Notre regard</span>
            <p id="bookReview"></p>
          </blockquote>
          <div class="edition-meta">
            <span id="editionLabel">Édition présentée</span>
            <strong id="editionPublisher"></strong>
            <small id="editionLanguage"></small>
          </div>
        </div>
      </div>
    </dialog>
  </div>
  <noscript>Cette bibliothèque interactive nécessite JavaScript.</noscript>
  <script type="module" src="../app.js"></script>
</body>
</html>
